# Publishes Little Hafiz Quest on GitHub Pages from the main branch.
# The classic version (v1) was retired in v2.5.0; the v1/ folder on main sends old links to the game and
# clears the classic version's offline copy from phones that had it.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: latest
      - name: Put the site together
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude screenshots latest/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
